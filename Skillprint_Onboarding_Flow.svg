<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" style="background:#090D16; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Column Backdrop Glowing Gradients -->
    <linearGradient id="portalGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="sdkGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="loopGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Glowing Loop Path Gradient -->
    <linearGradient id="loopPathGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Header Accent Gradient -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background Grid Pattern -->
  <rect width="1600" height="900" fill="#070A13"/>
  <g stroke="#1F2937" stroke-width="0.5" opacity="0.2">
    <path d="M 0,100 L 1600,100 M 0,200 L 1600,200 M 0,300 L 1600,300 M 0,400 L 1600,400 M 0,500 L 1600,500 M 0,600 L 1600,600 M 0,700 L 1600,700 M 0,800 L 1600,800" />
    <path d="M 200,0 L 200,900 M 400,0 L 400,900 M 600,0 L 600,900 M 800,0 L 800,900 M 1000,0 L 1000,900 M 1200,0 L 1200,900 M 1400,0 L 1400,900" />
  </g>

  <!-- Title & Branding -->
  <g transform="translate(80, 50)">
    <rect x="-4" y="-12" width="1440" height="4" fill="url(#headerGrad)"/>
    <text x="0" y="24" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">SKILLPRINT ONBOARDING &amp; ADAPTIVITY ENGINE</text>
    <text x="0" y="48" font-size="14" font-weight="500" fill="#94A3B8">Self-service registration setup, SDK implementation, and the real-time player adjustment loop</text>
  </g>

  <!-- Swimlanes / Columns Backdrops -->
  <!-- Column 1: Portal -->
  <g id="col-portal">
    <rect x="80" y="140" width="400" height="680" rx="16" fill="url(#portalGlow)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.2"/>
    <rect x="80" y="140" width="400" height="40" rx="16" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="280" y="166" font-size="13" font-weight="bold" fill="#3B82F6" letter-spacing="2" text-anchor="middle">1. SELF-SERVICE ONBOARDING</text>
  </g>

  <!-- Column 2: SDK -->
  <g id="col-sdk">
    <rect x="540" y="140" width="400" height="680" rx="16" fill="url(#sdkGlow)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2"/>
    <rect x="540" y="140" width="400" height="40" rx="16" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="740" y="166" font-size="13" font-weight="bold" fill="#10B981" letter-spacing="2" text-anchor="middle">2. SDK INTEGRATION</text>
  </g>

  <!-- Column 3: Live Feedback Loop -->
  <g id="col-loop">
    <rect x="1000" y="140" width="520" height="680" rx="16" fill="url(#loopGlow)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.2"/>
    <rect x="1000" y="140" width="520" height="40" rx="16" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="1260" y="166" font-size="13" font-weight="bold" fill="#8B5CF6" letter-spacing="2" text-anchor="middle">3. REAL-TIME ADJUSTMENT LOOP</text>
  </g>

  <!-- CONNECTING FLOW ARROWS BETWEEN COLUMNS -->
  <!-- Onboarding (Col 1) to SDK Setup (Col 2) -->
  <path d="M 450,590 C 510,590 510,250 560,250" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <rect x="460" y="405" width="90" height="30" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="505" y="424" font-size="10" font-weight="bold" fill="#3B82F6" text-anchor="middle">API Credentials</text>

  <!-- SDK Setup (Col 2) to Real-Time Loop (Col 3) -->
  <path d="M 910,590 C 970,590 970,250 1080,250" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <rect x="940" y="405" width="80" height="30" rx="6" fill="#0F172A" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="980" y="424" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle">Auto-Register</text>


  <!-- ==================== swimlane 1: DEVELOPER ONBOARDING ==================== -->
  
  <!-- Step 1 Card -->
  <g id="step1" filter="url(#shadow)">
    <rect x="110" y="200" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="110" y="200" width="6" height="130" rx="2" fill="#3B82F6"/>
    <!-- Icon: Portal Account -->
    <circle cx="150" cy="265" r="20" fill="#3B82F6" fill-opacity="0.15"/>
    <path d="M150 262 a 4 4 0 1 0 0 -8 a 4 4 0 0 0 0 8 z M140 272 c 0 -4.5 4.5 -5 10 -5 s 10 .5 10 5" stroke="#3B82F6" stroke-width="2" fill="none"/>
    <!-- Text -->
    <text x="190" y="235" font-size="14" font-weight="bold" fill="#FFFFFF">1. Register Account</text>
    <text x="190" y="260" font-size="12" fill="#94A3B8">Sign up at the developer portal</text>
    <text x="190" y="278" font-size="12" fill="#94A3B8">to access the dashboard and</text>
    <text x="190" y="296" font-size="12" fill="#94A3B8">manage your game profiles.</text>
  </g>

  <!-- Step 1 -> Step 2 Arrow -->
  <path d="M 280,330 L 280,342" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 2 Card -->
  <g id="step2" filter="url(#shadow)">
    <rect x="110" y="350" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="110" y="350" width="6" height="130" rx="2" fill="#3B82F6"/>
    <!-- Icon: Controller -->
    <circle cx="150" cy="415" r="20" fill="#3B82F6" fill-opacity="0.15"/>
    <path d="M 137,415 C 137,407 145,407 150,407 C 155,407 163,407 163,415 C 163,421 159,423 155,423 L 145,423 C 141,423 137,421 137,415 Z" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="143" cy="415" r="1" fill="#3B82F6"/>
    <circle cx="157" cy="415" r="1" fill="#3B82F6"/>
    <path d="M 148,419 L 152,419" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Text -->
    <text x="190" y="385" font-size="14" font-weight="bold" fill="#FFFFFF">2. Configure Game Profile</text>
    <text x="190" y="410" font-size="12" fill="#94A3B8">Select targeted moods &amp; skills</text>
    <text x="190" y="428" font-size="12" fill="#94A3B8">(e.g., Focus, Relax, Grit)</text>
    <text x="190" y="446" font-size="12" fill="#94A3B8">to guide backend AI scoring.</text>
  </g>

  <!-- Step 2 -> Step 3 Arrow -->
  <path d="M 280,480 L 280,492" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 3 Card -->
  <g id="step3" filter="url(#shadow)">
    <rect x="110" y="500" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="110" y="500" width="6" height="130" rx="2" fill="#3B82F6"/>
    <!-- Icon: Key -->
    <circle cx="150" cy="565" r="20" fill="#3B82F6" fill-opacity="0.15"/>
    <circle cx="145" cy="560" r="5" stroke="#3B82F6" stroke-width="2" fill="none"/>
    <path d="M 149,564 L 158,573 M 153,568 L 156,565 M 156,571 L 159,568" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <!-- Text -->
    <text x="190" y="535" font-size="14" font-weight="bold" fill="#FFFFFF">3. Generate API Key</text>
    <text x="190" y="560" font-size="12" fill="#94A3B8">Acquire a secure credential key</text>
    <text x="190" y="578" font-size="12" fill="#94A3B8">and game slug to connect your</text>
    <text x="190" y="596" font-size="12" fill="#94A3B8">project with Skillprint APIs.</text>
  </g>


  <!-- ==================== swimlane 2: SDK INTEGRATION ==================== -->

  <!-- Step 4 Card -->
  <g id="step4" filter="url(#shadow)">
    <rect x="570" y="200" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="570" y="200" width="6" height="130" rx="2" fill="#10B981"/>
    <!-- Icon: Package -->
    <circle cx="610" cy="265" r="20" fill="#10B981" fill-opacity="0.15"/>
    <path d="M 610,250 L 625,257 L 625,273 L 610,280 L 595,273 L 595,257 Z M 595,257 L 610,265 L 625,257 M 610,265 L 610,280" stroke="#10B981" stroke-width="2" fill="none"/>
    <!-- Text -->
    <text x="650" y="235" font-size="14" font-weight="bold" fill="#FFFFFF">4. Download &amp; Install SDK</text>
    <text x="650" y="260" font-size="12" fill="#94A3B8">Import the Unity SDK package</text>
    <text x="650" y="278" font-size="12" fill="#94A3B8">(UPM) or Cocos npm package</text>
    <text x="650" y="296" font-size="12" fill="#94A3B8">directly into your codebase.</text>
  </g>

  <!-- Step 4 -> Step 5 Arrow -->
  <path d="M 740,330 L 740,342" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 5 Card -->
  <g id="step5" filter="url(#shadow)">
    <rect x="570" y="350" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="570" y="350" width="6" height="130" rx="2" fill="#10B981"/>
    <!-- Icon: Gear -->
    <circle cx="610" cy="415" r="20" fill="#10B981" fill-opacity="0.15"/>
    <circle cx="610" cy="415" r="6" stroke="#10B981" stroke-width="2" fill="none"/>
    <path d="M 610,405 v 3 M 610,422 v 3 M 600,415 h 3 M 617,415 h 3" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <!-- Text -->
    <text x="650" y="385" font-size="14" font-weight="bold" fill="#FFFFFF">5. Configure Config Asset</text>
    <text x="650" y="410" font-size="12" fill="#94A3B8">Apply API Key, Game Name,</text>
    <text x="650" y="428" font-size="12" fill="#94A3B8">and Base URL inside the</text>
    <text x="650" y="446" font-size="12" fill="#94A3B8">SkillprintConfig Inspector.</text>
  </g>

  <!-- Step 5 -> Step 6 Arrow -->
  <path d="M 740,480 L 740,492" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 6 Card -->
  <g id="step6" filter="url(#shadow)">
    <rect x="570" y="500" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="570" y="500" width="6" height="130" rx="2" fill="#10B981"/>
    <!-- Icon: Sliders -->
    <circle cx="610" cy="565" r="20" fill="#10B981" fill-opacity="0.15"/>
    <path d="M 598,559 h 24 M 598,571 h 24 M 605,555 v 8 M 615,567 v 8" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Text -->
    <text x="650" y="535" font-size="14" font-weight="bold" fill="#FFFFFF">6. Define Game Parameters</text>
    <text x="650" y="560" font-size="12" fill="#94A3B8">Declare game variables (e.g. speed)</text>
    <text x="650" y="578" font-size="12" fill="#94A3B8">with minimum, maximum, and</text>
    <text x="650" y="596" font-size="12" fill="#94A3B8">default values for tuning.</text>
  </g>


  <!-- ==================== swimlane 3: REAL-TIME ADAPTIVITY LOOP ==================== -->

  <!-- Loop Card A (Active Gameplay) -->
  <g id="loop-a" filter="url(#shadow)">
    <rect x="1090" y="200" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="1090" y="200" width="6" height="130" rx="2" fill="#8B5CF6"/>
    <!-- Icon: Screen / Monitor -->
    <circle cx="1130" cy="265" r="20" fill="#8B5CF6" fill-opacity="0.15"/>
    <rect x="1115" y="255" width="30" height="18" rx="2" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    <path d="M 1125,273 L 1122,279 L 1138,279 L 1135,273" stroke="#8B5CF6" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <!-- Text -->
    <text x="1170" y="235" font-size="14" font-weight="bold" fill="#FFFFFF">A. Game &amp; Client SDK</text>
    <text x="1170" y="260" font-size="12" fill="#94A3B8">SDK captures user interactions</text>
    <text x="1170" y="278" font-size="12" fill="#94A3B8">and transmits visual gameplay</text>
    <text x="1170" y="296" font-size="12" fill="#94A3B8">chunks to the Skillprint API.</text>
  </g>

  <!-- Loop Card A -> Loop Card B Arrow -->
  <path d="M 1260,330 L 1260,342" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <!-- Arrow text -->
  <text x="1270" y="340" font-size="9" font-weight="bold" fill="#8B5CF6">Screenshots &amp; Events</text>

  <!-- Loop Card B (Skillprint AI Engine) -->
  <g id="loop-b" filter="url(#shadow)">
    <rect x="1090" y="350" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="1090" y="350" width="6" height="130" rx="2" fill="#8B5CF6"/>
    <!-- Icon: Brain / Cloud -->
    <circle cx="1130" cy="415" r="20" fill="#8B5CF6" fill-opacity="0.15"/>
    <path d="M 1121,415 C 1116,415 1115,409 1120,403 C 1118,397 1124,393 1130,397 C 1136,393 1142,397 1140,403 C 1145,409 1144,415 1139,415 Z" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    <circle cx="1126" cy="407" r="1" fill="#8B5CF6"/>
    <circle cx="1134" cy="407" r="1" fill="#8B5CF6"/>
    <path d="M 1130,402 L 1130,415" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 1"/>
    <!-- Text -->
    <text x="1170" y="385" font-size="14" font-weight="bold" fill="#FFFFFF">B. AI Engine (Value Add)</text>
    <text x="1170" y="410" font-size="12" fill="#94A3B8">Gemini VLM maps screenshot</text>
    <text x="1170" y="428" font-size="12" fill="#94A3B8">data to cognitive profiles</text>
    <text x="1170" y="446" font-size="12" fill="#94A3B8">for real-time player analysis.</text>
  </g>

  <!-- Loop Card B -> Loop Card C Arrow -->
  <path d="M 1260,480 L 1260,492" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <!-- Arrow text -->
  <text x="1270" y="490" font-size="9" font-weight="bold" fill="#8B5CF6">Cognitive &amp; Mood Map</text>

  <!-- Loop Card C (Real-Time Gameplay Adjustments) -->
  <g id="loop-c" filter="url(#shadow)">
    <rect x="1090" y="500" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="1090" y="500" width="6" height="130" rx="2" fill="#8B5CF6"/>
    <!-- Icon: Refresh Circle -->
    <circle cx="1130" cy="565" r="20" fill="#8B5CF6" fill-opacity="0.15"/>
    <path d="M 1120,565 A 10,10 0 1,1 1130,575" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
    <path d="M 1140,565 A 10,10 0 1,1 1130,555" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
    <path d="M 1128,552 L 1133,555 L 1130,560 Z" fill="#8B5CF6"/>
    <path d="M 1132,578 L 1127,575 L 1130,570 Z" fill="#8B5CF6"/>
    <!-- Text -->
    <text x="1170" y="535" font-size="14" font-weight="bold" fill="#FFFFFF">C. Dynamic Adjustments</text>
    <text x="1170" y="560" font-size="12" fill="#94A3B8">Game receives parameters</text>
    <text x="1170" y="578" font-size="12" fill="#94A3B8">updates and scales mechanics</text>
    <text x="1170" y="596" font-size="12" fill="#94A3B8">to keep player in perfect flow.</text>
  </g>

  <!-- Circular Loop Path: Card C back to Card A -->
  <!-- Arc on the right side of the cards returning back up to the top -->
  <path d="M 1430,565 C 1515,565 1515,265 1440,265" fill="none" stroke="url(#loopPathGrad)" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-gold)"/>
  <!-- Label on Loop -->
  <rect x="1465" y="405" width="28" height="120" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1483" y="465" font-size="10" font-weight="bold" fill="#F59E0B" text-anchor="middle" transform="rotate(90 1483 465)">ADAPTIVE ADJUSTMENT LOOP</text>

  <!-- Footers & Meta Info -->
  <g id="footer" transform="translate(80, 850)">
    <text x="0" y="0" fill="#64748B" font-size="11">Skillprint Developer Onboarding Schema | Interchangeable Vector Template</text>
    <text x="1440" y="0" fill="#8B5CF6" font-size="11" text-anchor="end">Value Add: Automatic screenshots uploaded &amp; evaluated to construct cognitive profiles</text>
  </g>
</svg>
